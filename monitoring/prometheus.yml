global:
  scrape_interval: 5s

scrape_configs:
  - job_name: ingestion-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ingestion-service:8080']

  - job_name: consumer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['consumer-service:8081']

  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']
