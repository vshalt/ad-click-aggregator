services:
  postgres:
    image: postgres:trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql

  pgbouncer:
    image: edoburu/pgbouncer
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_NAME: postgres
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 65
      AUTH_TYPE: scram-sha-256
    depends_on:
      - postgres
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092, CONTROLLER://0.0.0.0:9093
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      KAFKA_DELETE_TOPIC_ENABLE: true
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_BROKER_LISTENER_NAMES: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_INGESTION_TOPIC_NAME: ingestion
      SPRING_KAFKA_INGESTION_CONCURRENCY: 1
      SPRING_KAFKA_INGESTION_GROUP_ID: consumer
      SPRING_KAFKA_INGESTION_TOPIC_PARTITIONS: 64
      SPRING_KAFKA_INGESTION_TOPIC_REPLICAS: 1
      SPRING_DATASOURCE_MAX_POOL_SIZE: 64
    restart: unless-stopped

  consumer-service:
    deploy:
      replicas: 1
    build:
      context: .
      dockerfile: consumer-service/Dockerfile
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgbouncer:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_INGESTION_GROUP_ID: consumer
      SPRING_KAFKA_INGESTION_TOPIC_NAME: ingestion
      SPRING_KAFKA_INGESTION_CONCURRENCY: 64
      SPRING_KAFKA_INGESTION_DLT_TOPIC_NAME: ingestion-dlt
      SPRING_KAFKA_INGESTION_DLT_TOPIC_PARTITIONS: 1
      SPRING_KAFKA_INGESTION_DLT_TOPIC_REPLICAS: 1
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - ingestion-service
      - consumer-service

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  kafka-exporter:
    image: danielqsj/kafka-exporter
    ports:
      - "9308:9308"
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      - kafka
    restart: unless-stopped

  k6:
    image: grafana/k6
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/scripts
    environment:
      - RATE=5000
      - DURATION=30s
      - URL=http://ingestion-service:8080/api/v1/logs/
    command: run /scripts/ingestion.js

volumes:
  postgres_data:
  grafana_data:
